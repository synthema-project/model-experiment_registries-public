apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-experiment-registry-deployment
  namespace: synthema-dev
spec:
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      volumes:
        - name: mlflow-setup-volume
          emptyDir: {}
        - name: mlflow-auth
          secret:
            secretName: mlflow-auth
      initContainers:
        - name: init-mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.2
          command: [ "sh", "-c" ]
          args:
            - |
              exec pip install --no-cache-dir --only-binary=:all: \
                psycopg2-binary boto3 "mlflow[auth]==2.16.2" --target /mlflow-setup
          volumeMounts:
            - name: mlflow-setup-volume
              mountPath: /mlflow-setup
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.2
          imagePullPolicy: IfNotPresent
          command: [ "sh", "-c" ]
          args:
            - |
              export PYTHONPATH=/mlflow-setup
              backend_store_uri="${BACKEND_STORE_URI:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_URL}/${POSTGRES_DB_NAME}}"
              exec mlflow server --backend-store-uri "${backend_store_uri}" \
              --host 0.0.0.0 \
              --port 80 \
              --artifacts-destination "${ARTIFACTS_DESTINATION}" \
              --app-name basic-auth \
              --serve-artifacts
          volumeMounts:
            - name: mlflow-setup-volume
              mountPath: /mlflow-setup
            - name: mlflow-auth
              mountPath: /mlflow-auth
              readOnly: true
          env:
            - name: MLFLOW_AUTH_CONFIG_PATH
              value: /mlflow-auth/basic_auth.ini
            - name: BACKEND_STORE_URI
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: BACKEND_STORE_URI
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: POSTGRES_URL
            - name: POSTGRES_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: POSTGRES_DB_NAME
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: MLFLOW_S3_ENDPOINT_URL
            - name: ARTIFACTS_DESTINATION
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: ARTIFACTS_DESTINATION

          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: model-experiment-registry-service
  namespace: synthema-dev
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  name: model-experiment-registry-ingress-rule
  namespace: synthema-dev
spec:
  ingressClassName: nginx
  rules:
    - host: mlflow.k8s.synthema.rid-intrasoft.eu
      http:
        paths:
          - backend:
              service:
                name: model-experiment-registry-service
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - mlflow.k8s.synthema.rid-intrasoft.eu
      secretName: model-experiment-registry-secret-tls
